<!DOCTYPE html>
<html>
  <head>
    <title>Hello WebSocket</title>
    <link href="/bootstrap.min.css" rel="stylesheet"/>
    <link href="/main.css" rel="stylesheet" />
    <script src="/jquery-3.1.1.min.js"></script>
    <script src="/stomp.umd.min.js"></script>
    <script src="/sender.js"></script>
  </head>
  <body>
    <noscript
      ><h2 style="color: #ff0000">
        Seems your browser doesn't support Javascript! Websocket relies on
        Javascript being enabled. Please enable Javascript and reload this page!
      </h2></noscript
    >
    <div id="main-content" class="container">
      <div class="row">
        <div class="col-md-6">
          <form class="form-inline">
            <div class="form-group">
              <label for="connect">WebSocket connection:</label>
              <button id="connect" class="btn btn-default btn-lg" type="submit">
                Connect
              </button>
              <button
                id="disconnect"
                class="btn btn-default btn-lg"
                type="submit"
                disabled="disabled"
              >
                Disconnect
              </button>
            </div>
          </form>
        </div>
        <div class="col-md-6">
          <form class="form-inline">
            <div class="form-group">
              <label for="name">Enter New Text To Publish?</label>
              <input
                type="text"
                id="name"
                class="form-control input-lg"
                placeholder="New Text here..."
              />
            </div>
            <button id="send" class="btn btn-default btn-lg" type="submit">
              Send
            </button>
          </form>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12">
          <table
            id="conversation"
            class="table table-striped table-responsive-lg"
          >
            <thead>
              <tr>
                <th>Display History</th>
              </tr>
            </thead>
            <tbody id="displayed"></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
